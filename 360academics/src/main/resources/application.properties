spring.application.name=360academics
spring.messages.basename=messages

# Configuracoes de conexao do banco H2 (em memoria)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Criacao e atualizacao automatica das tabelas (DDL) a partir das entidades
spring.jpa.hibernate.ddl-auto=update

# Exibe no console os comandos SQL executados
spring.jpa.show-sql=true

# Habilita o console web do banco em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Habilita o suporte nativo a Problem Details (RFC 9457) nas respostas de erro da API
spring.mvc.problemdetails.enabled=true
