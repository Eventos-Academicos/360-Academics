<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{baseLayout :: layout(pageTitle=${titulo}, content=~{::content})}">
<th:block th:fragment="content">
    <section class="hero">
        <h1 th:text="${titulo}">Editar Certificado</h1>
        <p>Ajuste o código de validação do certificado.</p>
    </section>

    <section class="section-card">
        <form method="post" th:object="${certificadoRequest}" th:action="@{/certificados/{id}(id=${id})}">
            <label for="codigoValidacao">Código de validação</label>
            <input type="text" id="codigoValidacao" th:field="*{codigoValidacao}" th:errorclass="is-invalid">
            <span class="erro-campo" th:if="${#fields.hasErrors('codigoValidacao')}" th:errors="*{codigoValidacao}">Código inválido</span>

            <button type="submit">Salvar</button>
        </form>
    </section>
</th:block>
</html>
