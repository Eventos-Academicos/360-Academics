<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{baseLayout :: layout(pageTitle=${titulo}, content=~{::content})}">
<th:block th:fragment="content">
    <section class="hero">
        <h1 th:text="${titulo}">Palestrante</h1>
        <p>Preencha os dados do palestrante.</p>
    </section>

    <section class="section-card">
        <form method="post"
              th:action="${id} != null ? @{/palestrantes/{id}(id=${id})} : @{/palestrantes}">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required
                   th:value="${palestrante != null ? palestrante.nome : ''}">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required
                   th:value="${palestrante != null ? palestrante.email : ''}">

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha"
                   th:required="${palestrante == null}"
                   placeholder="Deixe em branco para manter a atual">
            <p th:if="${palestrante != null}"><small>Deixe em branco para manter a senha atual.</small></p>

            <label for="especialidade">Especialidade</label>
            <input type="text" id="especialidade" name="especialidade" required
                   th:value="${palestrante != null ? palestrante.especialidade : ''}">

            <button type="submit">Salvar</button>
        </form>
    </section>
</th:block>
</html>
