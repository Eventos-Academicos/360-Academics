<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{baseLayout :: layout(pageTitle=${titulo}, content=~{::content})}">
<th:block th:fragment="content">
    <section class="hero">
        <h1 th:text="${titulo}">Recurso não encontrado</h1>
        <p>O registro que você tentou acessar não existe ou já foi removido.</p>
    </section>

    <section class="section-card">
        <p class="alert-erro" th:text="${mensagem}">Detalhe do erro.</p>
    </section>

    <section class="section-card callout">
        <div>
            <h2>O que fazer agora</h2>
            <p>Confira o endereço ou volte para a listagem e escolha um registro existente.</p>
        </div>
        <a class="btn" th:href="@{/inicial}">Voltar ao início</a>
    </section>
</th:block>
</html>
