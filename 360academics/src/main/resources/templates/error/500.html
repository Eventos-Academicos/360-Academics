<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{baseLayout :: layout(pageTitle=${titulo}, content=~{::content})}">
<th:block th:fragment="content">
    <section class="hero">
        <h1 th:text="${titulo}">Erro interno</h1>
        <p>Algo inesperado aconteceu ao processar sua solicitação.</p>
    </section>

    <section class="section-card">
        <p class="alert-erro" th:text="${mensagem}">Detalhe do erro.</p>
    </section>

    <section class="section-card callout">
        <div>
            <h2>O que fazer agora</h2>
            <p>Tente novamente em instantes. Se o problema continuar, avise a coordenação do projeto.</p>
        </div>
        <a class="btn" th:href="@{/inicial}">Voltar ao início</a>
    </section>
</th:block>
</html>
