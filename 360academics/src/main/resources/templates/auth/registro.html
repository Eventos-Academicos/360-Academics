<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{baseLayout :: layout(pageTitle=${titulo}, content=~{::content})}">
<th:block th:fragment="content">
    <section class="hero">
        <h1 th:text="${titulo}">Criar Conta</h1>
        <p>Cadastre-se como participante da plataforma 360 Academics.</p>
    </section>

    <section class="section-card">
        <form method="post" th:object="${participanteRequest}" th:action="@{/registro}">
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" th:errorclass="is-invalid">
            <span class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Nome inválido</span>

            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" th:errorclass="is-invalid">
            <span class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email inválido</span>

            <label for="senha">Senha</label>
            <input type="password" id="senha" th:field="*{senha}" th:errorclass="is-invalid">
            <span class="erro-campo" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}">Senha inválida</span>

            <label for="matricula">Matrícula</label>
            <input type="text" id="matricula" th:field="*{matricula}" th:errorclass="is-invalid">
            <span class="erro-campo" th:if="${#fields.hasErrors('matricula')}" th:errors="*{matricula}">Matrícula inválida</span>

            <button type="submit">Criar conta</button>
        </form>
    </section>
</th:block>
</html>
