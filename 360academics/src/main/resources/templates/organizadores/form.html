<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{baseLayout :: layout(pageTitle=${titulo}, content=~{::content})}">
<th:block th:fragment="content">
    <section class="hero">
        <h1 th:text="${titulo}">Organizador</h1>
        <p>Preencha os dados do organizador.</p>
    </section>

    <section class="section-card">
        <form method="post" th:object="${organizadorRequest}"
              th:action="${id} != null ? @{/organizadores/{id}(id=${id})} : @{/organizadores}">
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" th:errorclass="is-invalid">
            <span class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Nome inválido</span>

            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" th:errorclass="is-invalid">
            <span class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email inválido</span>

            <label for="senha">Senha</label>
            <input type="password" id="senha" th:field="*{senha}" th:errorclass="is-invalid"
                   placeholder="Deixe em branco para manter a atual">
            <span class="erro-campo" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}">Senha inválida</span>
            <p th:if="${id != null}"><small>Deixe em branco para manter a senha atual.</small></p>

            <button type="submit">Salvar</button>
        </form>
    </section>
</th:block>
</html>
