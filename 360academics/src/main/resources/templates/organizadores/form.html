<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{baseLayout :: layout(pageTitle=${titulo}, content=~{::content})}">
<th:block th:fragment="content">
    <section class="hero">
        <h1 th:text="${titulo}">Organizador</h1>
        <p>Preencha os dados do organizador.</p>
    </section>

    <section class="section-card">
        <form method="post"
              th:action="${id} != null ? @{/organizadores/{id}(id=${id})} : @{/organizadores}">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required
                   th:value="${organizador != null ? organizador.nome : ''}">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required
                   th:value="${organizador != null ? organizador.email : ''}">

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha"
                   th:required="${organizador == null}"
                   placeholder="Deixe em branco para manter a atual">
            <p th:if="${organizador != null}"><small>Deixe em branco para manter a senha atual.</small></p>

            <button type="submit">Salvar</button>
        </form>
    </section>
</th:block>
</html>
