<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{baseLayout :: layout(pageTitle=${titulo}, content=~{::content})}">
<th:block th:fragment="content">
    <section class="hero">
        <h1 th:text="${titulo}">Atividade</h1>
        <p>Preencha os dados da atividade.</p>
    </section>

    <section class="section-card">
        <form method="post" th:object="${atividadeRequest}"
              th:action="${atividadeId} != null ? @{/eventos/{eventoId}/atividades/{id}(eventoId=${eventoId},id=${atividadeId})} : @{/eventos/{eventoId}/atividades(eventoId=${eventoId})}">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" th:field="*{titulo}" th:errorclass="is-invalid">
            <span class="erro-campo" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}">Título inválido</span>

            <label for="horarioInicio">Início</label>
            <input type="datetime-local" id="horarioInicio" th:field="*{horarioInicio}" th:errorclass="is-invalid">
            <span class="erro-campo" th:if="${#fields.hasErrors('horarioInicio')}" th:errors="*{horarioInicio}">Horário inválido</span>

            <label for="horarioFim">Fim</label>
            <input type="datetime-local" id="horarioFim" th:field="*{horarioFim}" th:errorclass="is-invalid">
            <span class="erro-campo" th:if="${#fields.hasErrors('horarioFim')}" th:errors="*{horarioFim}">Horário inválido</span>

            <label for="local">Local</label>
            <input type="text" id="local" th:field="*{local}" th:errorclass="is-invalid">
            <span class="erro-campo" th:if="${#fields.hasErrors('local')}" th:errors="*{local}">Local inválido</span>

            <label for="palestranteId">Palestrante</label>
            <select id="palestranteId" th:field="*{palestranteId}" th:errorclass="is-invalid">
                <option value="">Selecione um palestrante</option>
                <option th:each="palestrante : ${palestrantes}"
                        th:value="${palestrante.id}"
                        th:text="${palestrante.nome}">
                    Nome do palestrante
                </option>
            </select>
            <span class="erro-campo" th:if="${#fields.hasErrors('palestranteId')}" th:errors="*{palestranteId}">Palestrante inválido</span>

            <button type="submit">Salvar</button>
        </form>
    </section>
</th:block>
</html>
