<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{baseLayout :: layout(pageTitle=${titulo}, content=~{::content})}">
<th:block th:fragment="content">
    <section class="hero">
        <h1 th:text="${titulo}">Atividade</h1>
        <p>Preencha os dados da atividade.</p>
    </section>

    <section class="section-card">
        <form method="post"
              th:action="${atividadeId} != null ? @{/eventos/{eventoId}/atividades/{id}(eventoId=${eventoId},id=${atividadeId})} : @{/eventos/{eventoId}/atividades(eventoId=${eventoId})}">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo" required
                   th:value="${atividade != null ? atividade.titulo : ''}">

            <label for="horarioInicio">Início</label>
            <input type="datetime-local" id="horarioInicio" name="horarioInicio" required
                   th:value="${atividade != null ? atividade.horarioInicio : ''}">

            <label for="horarioFim">Fim</label>
            <input type="datetime-local" id="horarioFim" name="horarioFim" required
                   th:value="${atividade != null ? atividade.horarioFim : ''}">

            <label for="local">Local</label>
            <input type="text" id="local" name="local" required
                   th:value="${atividade != null ? atividade.local : ''}">

            <label for="palestranteId">Palestrante</label>
            <select id="palestranteId" name="palestranteId" required>
                <option value="">Selecione um palestrante</option>
                <option th:each="palestrante : ${palestrantes}"
                        th:value="${palestrante.id}"
                        th:text="${palestrante.nome}"
                        th:selected="${atividade != null and atividade.palestrante.id == palestrante.id}">
                    Nome do palestrante
                </option>
            </select>

            <button type="submit">Salvar</button>
        </form>
    </section>
</th:block>
</html>
