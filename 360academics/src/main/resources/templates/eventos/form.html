<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{baseLayout :: layout(pageTitle=${titulo}, content=~{::content})}">
<th:block th:fragment="content">
    <section class="hero">
        <h1 th:text="${titulo}">Evento</h1>
        <p>Preencha os dados do evento acadêmico.</p>
    </section>

    <section class="section-card">
        <form method="post" th:object="${eventoRequest}"
              th:action="${id} != null ? @{/eventos/{id}(id=${id})} : @{/eventos}">
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" th:errorclass="is-invalid">
            <span class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Nome inválido</span>

            <label for="descricao">Descrição</label>
            <textarea id="descricao" rows="3" th:field="*{descricao}" th:errorclass="is-invalid"></textarea>
            <span class="erro-campo" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}">Descrição inválida</span>

            <label for="local">Local</label>
            <input type="text" id="local" th:field="*{local}" th:errorclass="is-invalid">
            <span class="erro-campo" th:if="${#fields.hasErrors('local')}" th:errors="*{local}">Local inválido</span>

            <label for="dataInicio">Data de início</label>
            <input type="date" id="dataInicio" th:field="*{dataInicio}" th:errorclass="is-invalid">
            <span class="erro-campo" th:if="${#fields.hasErrors('dataInicio')}" th:errors="*{dataInicio}">Data inválida</span>

            <label for="dataFim">Data de fim</label>
            <input type="date" id="dataFim" th:field="*{dataFim}" th:errorclass="is-invalid">
            <span class="erro-campo" th:if="${#fields.hasErrors('dataFim')}" th:errors="*{dataFim}">Data inválida</span>

            <label for="limiteVagas">Limite de vagas</label>
            <input type="number" id="limiteVagas" min="1" th:field="*{limiteVagas}" th:errorclass="is-invalid">
            <span class="erro-campo" th:if="${#fields.hasErrors('limiteVagas')}" th:errors="*{limiteVagas}">Limite inválido</span>

            <button type="submit">Salvar</button>
        </form>
    </section>
</th:block>
</html>
