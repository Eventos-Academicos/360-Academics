<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{baseLayout :: layout(pageTitle=${titulo}, content=~{::content})}">
<th:block th:fragment="content">
    <section class="hero">
        <h1 th:text="${titulo}">Histórico de Participação</h1>
        <p>Registre a conclusão de um evento por um participante.</p>
    </section>

    <section class="section-card">
        <form method="post"
              th:action="${id} != null ? @{/historico/{id}(id=${id})} : @{/historico}">
            <label for="participanteId">Participante</label>
            <select id="participanteId" name="participanteId" required>
                <option value="">Selecione um participante</option>
                <option th:each="participante : ${participantes}"
                        th:value="${participante.id}"
                        th:text="${participante.nome}"
                        th:selected="${item != null and item.participante.id == participante.id}">
                    Nome do participante
                </option>
            </select>

            <label for="eventoId">Evento</label>
            <select id="eventoId" name="eventoId" required>
                <option value="">Selecione um evento</option>
                <option th:each="evento : ${eventos}"
                        th:value="${evento.id}"
                        th:text="${evento.nome}"
                        th:selected="${item != null and item.evento.id == evento.id}">
                    Nome do evento
                </option>
            </select>

            <label for="dataConclusao">Data de conclusão</label>
            <input type="date" id="dataConclusao" name="dataConclusao" required
                   th:value="${item != null ? item.dataConclusao : ''}">

            <button type="submit">Salvar</button>
        </form>
    </section>
</th:block>
</html>
